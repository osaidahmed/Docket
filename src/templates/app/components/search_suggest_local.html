{% load app_tags %}
{% if results %}
  <div class="px-3 py-1.5 text-xs font-semibold text-gray-400 uppercase tracking-wider">
    {{ section_title|default:"Your Library" }}
  </div>
  {% for result in results %}
    <button type="button"
            role="option"
            class="suggest-item w-full flex items-center gap-3 px-3 py-2 text-left text-sm text-gray-300 hover:bg-card hover:text-white transition-colors"
            data-title="{{ result.title }}"
            data-media-id="{{ result.media_id }}"
            data-source="{{ result.source }}">
      <img src="{{ result.image }}"
           alt=""
           class="w-8 h-10 object-cover rounded shrink-0"
           loading="lazy">
      <div class="flex-1 min-w-0">
        <div class="truncate">{{ result.title }}</div>
        <div class="text-xs text-gray-500 truncate">
          {% if result.english_title %}
            {{ result.english_title }} ·
          {% endif %}
          {{ result.media_type|media_type_readable }}
          ·
          {{ result.status }}
        </div>
      </div>
    </button>
  {% endfor %}
{% endif %}
