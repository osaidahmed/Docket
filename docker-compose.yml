services:
  docket:
    container_name: docket
    image: ghcr.io/osaidahmed/docket
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - TZ=Europe/Berlin
      - SECRET=longstring
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./db:/docket/db
    ports:
      - "8000:8000"

  redis:
    container_name: docket-redis
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data:
